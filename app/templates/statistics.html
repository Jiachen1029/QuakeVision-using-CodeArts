{% extends "base.html" %}

{% block title %}统计分析{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>数据统计分析</h1>
    <div>
        <a href="{{ url_for('index', **request.args) }}" class="btn btn-outline-primary">返回列表</a>
    </div>
</div>

<div class="alert alert-info">
    当前统计基于筛选后的 <strong>{{ stats.total_count }}</strong> 条地震记录。
</div>

<div class="row">
    <!-- Magnitude Distribution -->
    <div class="col-md-6 mb-4">
        <div class="card h-100">
            <div class="card-header">震级分布 (M)</div>
            <div class="card-body">
                <div style="height: 300px;">
                    <canvas id="magChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Depth Distribution -->
    <div class="col-md-6 mb-4">
        <div class="card h-100">
            <div class="card-header">震源深度分布 (km)</div>
            <div class="card-body">
                <div style="height: 300px;">
                    <canvas id="depthChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <!-- Time Trend -->
    <div class="col-md-12 mb-4">
        <div class="card h-100">
            <div class="card-header">发震时间趋势</div>
            <div class="card-body">
                <div style="height: 350px;">
                    <canvas id="timeChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <!-- Location Distribution -->
    <div class="col-md-12 mb-4">
        <div class="card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>地区分布 (Top 10)</span>
                <div class="btn-group btn-group-sm btn-group-toggle" data-toggle="buttons">
                    <label class="btn btn-outline-secondary active">
                        <input type="radio" name="locOption" id="optionAll" autocomplete="off" checked onchange="updateLocChart('all')"> 全部
                    </label>
                    <label class="btn btn-outline-secondary">
                        <input type="radio" name="locOption" id="optionChina" autocomplete="off" onchange="updateLocChart('china')"> 国内
                    </label>
                    <label class="btn btn-outline-secondary">
                        <input type="radio" name="locOption" id="optionForeign" autocomplete="off" onchange="updateLocChart('foreign')"> 国外
                    </label>
                </div>
            </div>
            <div class="card-body">
                <div style="height: 400px;">
                    <canvas id="locChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // Common options
    const commonOptions = {
        responsive: true,
        maintainAspectRatio: false
    };

    // Data for Location Chart
    const locData = {
        'all': {
            labels: {{ stats.loc_labels | tojson }},
            values: {{ stats.loc_values | tojson }}
        },
        'china': {
            labels: {{ stats.loc_labels_china | tojson }},
            values: {{ stats.loc_values_china | tojson }}
        },
        'foreign': {
            labels: {{ stats.loc_labels_foreign | tojson }},
            values: {{ stats.loc_values_foreign | tojson }}
        }
    };

    // 1. Magnitude Chart
    new Chart(document.getElementById('magChart'), {
        type: 'bar',
        data: {
            labels: {{ stats.mag_labels | tojson }},
            datasets: [{
                label: '地震数量',
                data: {{ stats.mag_values | tojson }},
                backgroundColor: 'rgba(255, 99, 132, 0.5)',
                borderColor: 'rgba(255, 99, 132, 1)',
                borderWidth: 1
            }]
        },
        options: commonOptions
    });

    // 2. Depth Chart
    new Chart(document.getElementById('depthChart'), {
        type: 'bar',
        data: {
            labels: {{ stats.depth_labels | tojson }},
            datasets: [{
                label: '地震数量',
                data: {{ stats.depth_values | tojson }},
                backgroundColor: 'rgba(54, 162, 235, 0.5)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: commonOptions
    });

    // 3. Time Chart
    new Chart(document.getElementById('timeChart'), {
        type: 'line',
        data: {
            labels: {{ stats.time_labels | tojson }},
            datasets: [{
                label: '地震频次',
                data: {{ stats.time_values | tojson }},
                fill: true,
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                borderColor: 'rgba(75, 192, 192, 1)',
                tension: 0.3
            }]
        },
        options: commonOptions
    });

    // 4. Location Chart
    const locChartCtx = document.getElementById('locChart');
    let locChart = new Chart(locChartCtx, {
        type: 'pie', // or 'bar' horizontal
        data: {
            labels: locData.all.labels,
            datasets: [{
                label: '地震数量',
                data: locData.all.values,
                backgroundColor: [
                    '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF',
                    '#FF9F40', '#C9CBCF', '#FF6384', '#36A2EB', '#FFCE56'
                ]
            }]
        },
        options: {
            ...commonOptions,
            maintainAspectRatio: true // Pie charts look better with aspect ratio
        }
    });

    function updateLocChart(type) {
        const newData = locData[type];
        locChart.data.labels = newData.labels;
        locChart.data.datasets[0].data = newData.values;
        locChart.update();
    }
</script>
{% endblock %}
