{% extends "base.html" %}

{% block title %}地震地图可视化{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>地震分布地图</h1>
    <div>
        <a href="{{ url_for('index', **request.args) }}" class="btn btn-outline-primary">返回列表</a>
    </div>
</div>

<div class="alert alert-info">
    <i class="fas fa-info-circle"></i> 地图显示了当前筛选条件下的所有地震记录。圆点大小代表震级，颜色代表深度。点击圆点查看详情。
</div>

<div class="card">
    <div class="card-body p-0">
        <div id="map" style="height: 600px; width: 100%;"></div>
    </div>
</div>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
crossorigin=""/>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
crossorigin=""></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize map
        // Default view: Center of China roughly
        // attributionControl: false removes the "Leaflet | © OpenStreetMap contributors" text
        var map = L.map('map', {attributionControl: false}).setView([35.8617, 104.1954], 4);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            // attribution: '© OpenStreetMap contributors' // Hidden by attributionControl: false
        }).addTo(map);

        // Add Legend
        var legend = L.control({position: 'bottomright'});

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.style.backgroundColor = 'white';
            div.style.padding = '10px';
            div.style.borderRadius = '5px';
            div.style.boxShadow = '0 0 15px rgba(0,0,0,0.2)';
            
            var grades = [0, 3, 4, 5, 6, 7];
            var labels = ['<strong>震级 (M)</strong><br>'];
            var colors = ['#ffcc00', '#FD8D3C', '#FC4E2A', '#E31A1C', '#BD0026', '#800026'];

            // Loop through our magnitude intervals and generate a label with a colored square for each interval
            for (var i = 0; i < grades.length; i++) {
                // Determine color for this grade
                let color;
                if (grades[i] >= 7) color = '#800026';
                else if (grades[i] >= 6) color = '#BD0026';
                else if (grades[i] >= 5) color = '#E31A1C';
                else if (grades[i] >= 4) color = '#FC4E2A';
                else if (grades[i] >= 3) color = '#FD8D3C';
                else color = '#ffcc00';

                div.innerHTML +=
                    '<i style="background:' + color + '; width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.8; border-radius: 50%;"></i> ' +
                    (grades[i] === 0 ? '< 3' : 
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] : '+')) + '<br>';
            }

            return div;
        };

        legend.addTo(map);

        // Fetch data from API with current query parameters
        const searchParams = new URLSearchParams(window.location.search);
        fetch(`/api/data?${searchParams.toString()}`)
            .then(response => response.json())
            .then(data => {
                if (data.length === 0) {
                    alert('当前筛选条件下没有数据');
                    return;
                }

                const markers = [];

                data.forEach(eq => {
                    // Determine color based on magnitude (User asked for magnitude size, let's do color by magnitude too for clarity)
                    // Or color by depth? Usually depth is color, magnitude is size.
                    // Let's stick to: Size = Magnitude, Color = Magnitude (Yellow -> Red) for impact visualization
                    
                    let color = '#ffcc00'; // Yellow for small
                    if (eq.magnitude >= 7) color = '#800026'; // Dark Red
                    else if (eq.magnitude >= 6) color = '#BD0026';
                    else if (eq.magnitude >= 5) color = '#E31A1C';
                    else if (eq.magnitude >= 4) color = '#FC4E2A';
                    else if (eq.magnitude >= 3) color = '#FD8D3C';

                    // Radius: Scale magnitude
                    let radius = eq.magnitude * 2; 

                    const marker = L.circleMarker([eq.latitude, eq.longitude], {
                        radius: radius,
                        fillColor: color,
                        color: "#000",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    });

                    const popupContent = `
                        <strong>地点:</strong> ${eq.location}<br>
                        <strong>震级:</strong> M${eq.magnitude}<br>
                        <strong>深度:</strong> ${eq.depth} km<br>
                        <strong>时间:</strong> ${eq.time}<br>
                        <strong>类型:</strong> ${eq.event_type}
                    `;

                    marker.bindPopup(popupContent);
                    marker.addTo(map);
                    markers.push(marker);
                });

                // Adjust map view to fit all markers
                if (markers.length > 0) {
                    const group = new L.featureGroup(markers);
                    map.fitBounds(group.getBounds());
                }
            })
            .catch(error => {
                console.error('Error fetching earthquake data:', error);
                alert('加载地图数据失败');
            });
    });
</script>
{% endblock %}
